<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — KZSTRM</title>
    <link rel="icon" href="/icons/icon-192x192.png">
    <meta name="theme-color" content="#050505">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 440px;
            width: 100%;
            background: #111113;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 40px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(229, 9, 20, 0.25);
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #ffffff;
        }
        p {
            font-size: 14px;
            color: #a1a1aa;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background: #E50914;
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 6px 16px rgba(229, 9, 20, 0.35);
        }
        .btn:hover {
            background: #ff222d;
            transform: translateY(-2px);
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/icons/icon-192x192.png" alt="KZSTRM" class="logo">
        <div style="font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #ef4444; margin-bottom: 12px;">
            <span class="status-dot"></span> Tidak Ada Koneksi Internet
        </div>
        <h1>Kamu Sedang Offline</h1>
        <p>Koneksi internet kamu terputus. Sambungkan kembali Wi-Fi atau data seluler kamu untuk melanjutkan streaming di KZSTRM.</p>
        <button class="btn" onclick="window.location.reload()">Coba Muat Ulang</button>
    </div>
</body>
</html>
